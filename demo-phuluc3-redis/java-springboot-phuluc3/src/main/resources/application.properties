spring.application.name=demo-phuluc3-redis
server.port=8080

# =============================================================================
# MongoDB — nguồn sự thật Product (giống demo-bai4: chỉnh URI theo máy)
# Lab dùng DB riêng phuluc3; có auth thì thêm user/pass + authSource=admin
# =============================================================================
spring.data.mongodb.uri=mongodb://root:DBVWiYdDoMnfWmK@localhost:27017/db_java_t3h_module4_phuluc3?authSource=admin

# Có cả Mongo + Redis starter → tắt Redis repositories (tránh quét nhầm)
spring.data.redis.repositories.enabled=false

# =============================================================================
# §2–§3 — Redis cache (Docker compose map 6379 → host)
# Chạy trước: docker compose up -d (thư mục demo-phuluc3-redis/)
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=   # lab không dùng

# Dùng Redis làm CacheManager (không dùng Simple/concurrent map mặc định)
spring.cache.type=redis

# =============================================================================
# §5–§6 — TTL theo cache name (giây) — cấu hình trong RedisCacheConfig
# Lab: TTL ngắn để dễ quan sát MISS sau khi hết hạn
# =============================================================================
app.cache.hello-ttl-seconds=30
app.cache.product-ttl-seconds=60
app.product.seed-on-startup=true

# =============================================================================
# Logging — dễ thấy log MISS khi @Cacheable chạy thân method
# =============================================================================
logging.level.vn.demo=INFO
