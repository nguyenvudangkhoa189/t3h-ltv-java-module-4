spring.application.name=demo-bai4-auth

# MongoDB — chỉnh URI theo máy (có auth thì thêm user/pass + authSource=admin)
# Lab dùng DB riêng; nếu seed schema cũ → drop DB rồi start lại
spring.data.mongodb.uri=mongodb://root:DBVWiYdDoMnfWmK@localhost:27017/db_java_t3h_module4_bai4?authSource=admin

# ★ JWT — secret lab (≥ 32 ký tự cho HS256). Production: JWT_SECRET qua biến môi trường, không commit secret thật
