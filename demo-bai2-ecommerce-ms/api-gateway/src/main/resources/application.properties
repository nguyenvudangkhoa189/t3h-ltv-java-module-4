server.port=8080
spring.application.name=api-gateway

# Route tĩnh Phase 1 — KHÔNG Eureka / lb://
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=products
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.routes[2].id=orders
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

# CORS lab
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Cùng secret Auth — Gateway VERIFY JWT
app.jwt.secret=${JWT_SECRET:demo-bai4-lab-secret-change-me-32chars-min}

management.endpoints.web.exposure.include=health
# WebFlux: copy Reactor Context → ThreadLocal (MDC) khi hop thread
spring.reactor.context-propagation=auto
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [cid=%X{cid}] - %msg%n
logging.level.vn.demo=INFO
