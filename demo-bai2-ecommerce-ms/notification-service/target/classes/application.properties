server.port=8084
spring.application.name=notification-service

app.mail.enabled=false
app.mail.from=${MAIL_FROM:noreply@ecommerce.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Lab: khong ping SMTP khi health (username/password trong). Mail that bat app.mail.enabled=true.
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [cid=%X{cid}] - %msg%n
logging.level.vn.demo=INFO
