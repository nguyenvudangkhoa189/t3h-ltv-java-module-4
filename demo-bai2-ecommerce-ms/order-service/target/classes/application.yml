server:
  port: 8083

spring:
  application:
    name: order-service
  
  data:
    mongodb:
      uri: mongodb://root:DBVWiYdDoMnfWmK@localhost:27017/order_db?authSource=admin
  
  security:
    user:
      name: admin
      password: admin

app:
  services:
    product:
      url: http://localhost:8082
    notification:
      url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [cid=%X{cid}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    vn.demo: DEBUG