spring.application.name=demo-phuluc1-scheduled
server.port=8080

# =============================================================================
# §2 — Hello Scheduled (fixedRate). Tắt = false nếu console quá ồn khi demo ví dụ 1–2.
# =============================================================================
app.hello.enabled=true
app.hello.fixed-rate-ms=10000

# =============================================================================
# §3 — So sánh fixedRate vs fixedDelay (mặc định TẮT — bật khi giảng §3).
# =============================================================================
app.rate-delay-demo.enabled=false

# =============================================================================
# §5 — Ví dụ 1: khóa tài khoản chưa kích hoạt
# Lab: cron mỗi 30 giây để thấy log nhanh. Production thường: 0 */15 * * * *
# lock-after-hours=24 khớp nghiệp vụ; DataSeeder tạo sẵn 1 user quá 25h.
# =============================================================================
app.account.lock-cron=0/30 * * * * *
app.account.lock-after-hours=24
app.account.seed-on-startup=true

# =============================================================================
# §6 — Ví dụ 2: sinh báo cáo ngày (precompute → snapshot)
# Lab: mỗi 2 phút để quan sát. Production: 0 0 2 * * * + zone Asia/Ho_Chi_Minh
# =============================================================================
app.report.daily-cron=0 */2 * * * *
app.report.zone=Asia/Ho_Chi_Minh
app.report.seed-on-startup=true

# =============================================================================
# §9.1 — Thread pool > 1 (mặc định tắt). Bật khi giảng nâng cao.
# =============================================================================
app.scheduling.pool.enabled=false
