spring.application.name=demo-phuluc2-email
server.port=8080

# =============================================================================
# §2 — Gmail SMTP (điền App Password trước khi gửi mail thật)
# 1) Bật 2FA Google Account
# 2) Tạo App Password: https://myaccount.google.com/apppasswords
# 3) Thay username / password / from bên dưới bằng thông tin thật
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=replace-with-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From phải trùng (hoặc alias của) tài khoản Gmail đang SMTP
app.mail.from=your-email@gmail.com

# =============================================================================
# Logging — dễ thấy thread async-* vs http-nio-*
# =============================================================================
logging.level.vn.demo=INFO
